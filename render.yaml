# Render Blueprint（保留可用，但 2026-08 起主部署在自有服务器上：
# 卡密库是 SQLite，需要持久盘；Render 免费/入门盘易失。见 README「部署」。
services:
  - type: web
    name: pagezenith
    runtime: docker
    plan: starter          # 不再需要 standard —— 已砍掉 Chromium
    healthCheckPath: /api/seo-gap/health
    disk:
      name: data
      mountPath: /data     # 卡密/用量/生成结果都在这里
      sizeGB: 1
    envVars:
      - key: USE_MOCKS
        value: "false"
      - key: SERP_PROVIDER
        value: serper
      - key: FETCH_MODE
        value: httpx
      - key: BILLING_DB
        value: /data/billing.db
      - key: MAX_CONCURRENT_RUNS
        value: "2"
      # 三个付费 key 在 Render 控制台设为 Secret，别写进本文件：
      # OPENROUTER_API_KEY / SERPER_KEY / EXA_KEY
