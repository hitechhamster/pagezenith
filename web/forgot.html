<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>找回密码 · 页面科技</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="/assets/brand/logo.png" />
<link rel="stylesheet" href="/shared/app.css?v=a4435c68" />
<style>
  .box{max-width:400px;margin:38px auto 0;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:26px 24px}
  .box h1{font-size:23px;margin:0 0 6px}
  .box .sub{color:var(--muted);font-size:13.5px;line-height:1.75;margin:0 0 20px}
  .fld{margin-bottom:14px}
  .fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .fld input{width:100%}
  .box button{width:100%;margin-top:6px;padding:13px}
  .swap{margin-top:16px;font-size:13px;color:var(--muted);text-align:center}
  #msg{font-size:13px;margin-top:12px;min-height:18px;line-height:1.75}
</style>
<style>
  .sitefoot{max-width:1080px;margin:56px auto 22px;padding:16px 20px 0;border-top:1px solid var(--line);
    font-size:12.5px;color:var(--faint);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .sitefoot a{color:var(--muted)}
  .sitefoot a:hover{color:var(--accent)}
  .sitefoot span{opacity:.5}
</style>
</head>
<body>
<div class="nav">
  <div class="logo"><img src="/assets/brand/logo-128.png" alt="页面科技" onerror="this.style.display='none'" /></div><a class="brand" href="/" style="color:var(--text)">页面科技</a>
  <div class="grow"></div>
  <a class="navlink" href="/login">返回登录</a>
</div>

<div class="wrap" style="max-width:900px">
  <div class="box" id="box">
    <h1 id="title">找回密码</h1>
    <p class="sub" id="sub">填注册用的邮箱，我们发一个重置链接给你，30 分钟内有效。</p>

    <div id="step1">
      <div class="fld"><label>邮箱</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" /></div>
      <button id="go">发送重置链接</button>
    </div>

    <div id="step2" style="display:none">
      <div class="fld"><label>新密码</label>
        <input id="pw" type="password" autocomplete="new-password" placeholder="至少 8 位" /></div>
      <div class="fld"><label>再输一次</label>
        <input id="pw2" type="password" autocomplete="new-password" placeholder="确认新密码" /></div>
      <button id="setpw">设置新密码</button>
    </div>

    <div id="msg"></div>
    <div class="swap"><a href="/login">想起来了，去登录</a></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const token=new URLSearchParams(location.search).get("token")||"";
function say(m,bad){ $("msg").style.color=bad?"var(--seal)":"var(--accent)"; $("msg").innerHTML=m||""; }

/* 带 token 进来 = 从邮件点过来的，直接进设密码这一步 */
if(token){
  $("title").textContent="设置新密码";
  $("sub").textContent="设好之后所有已登录的设备都会退出，用新密码重新登录即可。";
  $("step1").style.display="none";
  $("step2").style.display="";
}

$("go").onclick=async()=>{
  const email=$("email").value.trim();
  if(!email) return say("请填邮箱。",true);
  $("go").disabled=true; say("发送中…");
  try{
    const r=await fetch("/api/auth/forgot",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({email})});
    const j=await r.json();
    if(!r.ok) throw new Error(j.detail||"发送失败");
    // 无论邮箱存不存在都是同一句话 —— 服务端刻意如此，别在这里泄露
    say(j.message||"如果这个邮箱注册过，重置链接已经发出去了。");
    $("step1").style.display="none";
  }catch(e){ say(String(e.message||e),true); }
  finally{ $("go").disabled=false; }
};

$("setpw").onclick=async()=>{
  const password=$("pw").value, password2=$("pw2").value;
  if(!password||!password2) return say("两个都要填。",true);
  if(password!==password2) return say("两次输入的密码不一样。",true);
  $("setpw").disabled=true; say("设置中…");
  try{
    const r=await fetch("/api/auth/reset",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token,password,password2})});
    const j=await r.json();
    if(!r.ok) throw new Error(j.detail||"设置失败");
    $("step2").style.display="none";
    say((j.message||"密码已重设。")+' <a href="/login">去登录 →</a>');
  }catch(e){ say(String(e.message||e),true); }
  finally{ $("setpw").disabled=false; }
};

$("email").addEventListener("keydown",e=>{ if(e.key==="Enter") $("go").click(); });
$("pw").addEventListener("keydown",e=>{ if(e.key==="Enter") $("pw2").focus(); });
$("pw2").addEventListener("keydown",e=>{ if(e.key==="Enter") $("setpw").click(); });
</script>

<div class="sitefoot">
  <a href="/terms">服务条款</a><span>·</span><a href="/privacy">隐私政策</a><span>·</span>
  <a href="mailto:hitechtransformsoda@gmail.com">hitechtransformsoda@gmail.com</a>
</div>
</body>
</html>
