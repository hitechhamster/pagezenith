<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>登录 · 页面科技</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="/assets/brand/logo.png" />
<link rel="stylesheet" href="/shared/app.css?v=a4435c68" />
<style>
  .box{max-width:400px;margin:38px auto 0;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:26px 24px}
  .box h1{font-size:23px;margin:0 0 6px}
  .box .sub{color:var(--muted);font-size:13.5px;line-height:1.75;margin:0 0 20px}
  .fld{margin-bottom:14px}
  .fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .fld input{width:100%}
  .box button{width:100%;margin-top:6px;padding:13px}
  .swap{margin-top:16px;font-size:13px;color:var(--muted);text-align:center}
  .swap a{cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  #msg{font-size:13px;margin-top:12px;min-height:18px;line-height:1.7}
  .note{font-size:12px;color:var(--faint);line-height:1.8;margin-top:18px;
    border-top:1px dashed var(--line);padding-top:14px}
</style>
<style>
  .sitefoot{max-width:1080px;margin:56px auto 22px;padding:16px 20px 0;border-top:1px solid var(--line);
    font-size:12.5px;color:var(--faint);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .sitefoot a{color:var(--muted)}
  .sitefoot a:hover{color:var(--accent)}
  .sitefoot span{opacity:.5}
</style>
</head>
<body>
<div class="nav">
  <div class="logo"><img src="/assets/brand/logo-128.png" alt="页面科技" onerror="this.style.display='none'" /></div><a class="brand" href="/" style="color:var(--text)">页面科技</a>
  <div class="grow"></div>
  <a class="navlink" href="/">返回工具</a>
</div>

<div class="wrap" style="max-width:900px">
  <div class="box">
    <h1 id="title">登录</h1>
    <p class="sub" id="sub">登录后点数记在账户上，换设备直接登录就能用。</p>

    <div class="fld"><label>邮箱</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com" /></div>
    <div class="fld"><label>密码</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="至少 8 位" /></div>
    <div class="fld" id="fld2" style="display:none"><label>再输一次密码</label>
      <input id="pw2" type="password" autocomplete="new-password" placeholder="确认密码" /></div>

    <button id="go">登录</button>
    <div id="msg"></div>

    <div class="swap">
      <span id="swapText">还没有账户？</span>
      <a id="swap">注册一个</a>
    </div>

    <div class="swap" id="forgot" style="margin-top:10px">
      <a href="/forgot">忘记密码？</a>
    </div>
    <div class="note" id="note" style="display:none"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let MODE="login";
const _q=new URLSearchParams(location.search);
const next=_q.get("next")||"/";

function say(m,bad){ $("msg").style.color=bad?"var(--seal)":"var(--accent)"; $("msg").textContent=m||""; }

function setMode(m){
  MODE=m;
  const reg = m==="register";
  $("title").textContent = reg?"注册":"登录";
  $("sub").textContent = reg
    ? "一个邮箱就能开始。点数记在账户上，不用保存任何卡号。"
    : "登录后点数记在账户上，换设备直接登录就能用。";
  $("go").textContent = reg?"注册并开始":"登录";
  $("swapText").textContent = reg?"已经有账户了？":"还没有账户？";
  $("swap").textContent = reg?"去登录":"注册一个";
  $("pw").autocomplete = reg?"new-password":"current-password";
  $("fld2").style.display = reg?"":"none";
  $("forgot").style.display = reg?"none":"";
  $("note").style.display = "none";
  if(!reg) $("pw2").value="";
  say("");
}
// 导航里的「注册」按钮带 ?mode=register 直接进注册态
if(_q.get("mode")==="register") setMode("register");
$("swap").onclick=()=>setMode(MODE==="login"?"register":"login");

async function submit(){
  const email=$("email").value.trim(), password=$("pw").value;
  if(!email||!password) return say("邮箱和密码都要填。",true);
  const body={email,password};
  if(MODE==="register"){
    const p2=$("pw2").value;
    if(!p2) return say("请再输一次密码。",true);
    if(p2!==password) return say("两次输入的密码不一样。",true);
    body.password2=p2;
  }
  $("go").disabled=true; say("处理中…");
  try{
    const r=await fetch("/api/auth/"+MODE,{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(body)});
    const j=await r.json();
    if(!r.ok) throw new Error(j.detail||"失败了");
    say("成功，正在跳转…");
    location.href=next;
  }catch(e){ say(String(e.message||e),true); }
  finally{ $("go").disabled=false; }
}
$("go").onclick=submit;
$("pw").addEventListener("keydown",e=>{ if(e.key==="Enter"){ if(MODE==="register") $("pw2").focus(); else submit(); } });
$("pw2").addEventListener("keydown",e=>{ if(e.key==="Enter") submit(); });
$("email").addEventListener("keydown",e=>{ if(e.key==="Enter") $("pw").focus(); });

// 已登录时不要静默弹走 —— 用户可能是自己点进来的，直接跳走会让人以为"被踢回去了"。
// 说清楚状态，把去处交给他。
fetch("/api/auth/me").then(r=>r.json()).then(j=>{
  if(!j.account) return;
  document.querySelector(".box").innerHTML=`
    <h1>你已登录</h1>
    <p class="sub">当前账户 <b>${j.account.email}</b>${
      j.balance?` · 余额 ${j.balance.remaining} 点`:""}</p>
    <div class="btns" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">
      <a class="keybtn" style="text-decoration:none;padding:11px 20px;border-radius:999px;
         background:var(--accent);color:#fff;border-color:var(--accent)" href="/tools/seo-writer">去写文章</a>
      <a class="keybtn" style="text-decoration:none;padding:11px 20px;border-radius:999px"
         href="/history">我的记录</a>
      <a class="keybtn" style="text-decoration:none;padding:11px 20px;border-radius:999px"
         href="/buy">充值</a>
    </div>
    <div class="swap" style="margin-top:18px">
      <a id="out">退出登录</a>
    </div>`;
  document.getElementById("out").onclick=async()=>{
    await fetch("/api/auth/logout",{method:"POST"}); location.reload();
  };
}).catch(()=>{});
</script>

<div class="sitefoot">
  <a href="/terms">服务条款</a><span>·</span><a href="/privacy">隐私政策</a><span>·</span>
  <a href="mailto:hitechtransformsoda@gmail.com">hitechtransformsoda@gmail.com</a>
</div>
</body>
</html>
