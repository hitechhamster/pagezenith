<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>我的记录 · 页面科技</title>
<link rel="stylesheet" href="/shared/app.css?v=a4435c68" />
<style>
  .sub{color:var(--muted);font-size:14px;margin:0 0 20px;max-width:60ch;line-height:1.7}
  /* 余额摘要条：让用户随时对得上账 —— 预付费模式下这是信任的地基。
     末尾常驻续卡入口：点数见底的那一刻正是最该续的时候。 */
  .balance{display:flex;flex-wrap:wrap;align-items:stretch;background:var(--card);
    border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);
    overflow:hidden;margin-bottom:16px}
  .balance .b{flex:1 1 128px;padding:14px 18px;border-right:1px dashed var(--line)}
  .balance .b:last-of-type{border-right:0}
  .balance .k{font-size:11.5px;color:var(--muted);margin-bottom:4px}
  .balance .v{font-family:var(--font-mono);font-size:24px;font-weight:500;
    font-variant-numeric:tabular-nums;line-height:1.2}
  .balance .v small{font-size:13px;color:var(--faint);font-weight:400}
  .balance .v.accent{color:var(--accent)}
  .balance .v.low{color:var(--seal)}
  .balance .buy{display:flex;align-items:center;padding:14px 18px;border-left:1px dashed var(--line)}
  .balance .buy a{display:inline-block;border:1px solid var(--line);border-radius:999px;
    padding:9px 18px;font-size:13px;color:var(--text);white-space:nowrap}
  .balance .buy a:hover{border-color:var(--accent)}
  .balance .empty{padding:14px 18px}
  /* 账户行：登出入口一直没有界面出口，用户没法换号 */
  .whoami{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    font-size:13px;color:var(--muted);margin-bottom:10px}
  .whoami .lnk{background:none;border:none;color:var(--muted);cursor:pointer;
    text-decoration:underline;text-underline-offset:3px;font-size:13px;padding:0;
    border-radius:0}
  .whoami .lnk:hover{color:var(--seal);transform:none;box-shadow:none}
  /* 兑换：收进折叠区 —— 账户充值才是主路径，这个是给礼品券/补偿点数用的 */
  .redeem{border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--card);
    padding:12px 16px;margin-bottom:14px}
  .redeem summary{cursor:pointer;font-size:13px;color:var(--muted);list-style:none}
  .redeem summary::-webkit-details-marker{display:none}
  .redeem summary:before{content:"＋ ";color:var(--accent)}
  .redeem[open] summary:before{content:"－ "}
  .rd-row{display:flex;gap:8px;margin:12px 0 8px;flex-wrap:wrap}
  .rd-row input{flex:1;min-width:200px;font-family:var(--font-mono)}
  .rd-msg{font-size:12px;color:var(--faint);line-height:1.7}
  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tabs button{background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer}
  .tabs button.on{background:var(--accentsoft);border-color:var(--accent);color:var(--accent)}
  .item{display:flex;gap:14px;align-items:baseline;padding:13px 16px;border:1px solid var(--line);
    border-radius:10px;background:var(--card);margin-bottom:8px;cursor:pointer;transition:border-color .15s}
  .item:hover{border-color:var(--accent)}
  .item .t{flex:1;font-size:14px;color:var(--text);line-height:1.5}
  .item .s{font-size:12px;color:var(--muted);margin-top:2px}
  .item .d{font-size:12px;color:var(--faint);white-space:nowrap}
  .item .tag{font-size:11px;color:var(--accent);background:var(--accentsoft);border-radius:6px;
    padding:2px 8px;white-space:nowrap}
  .empty{color:var(--faint);font-size:14px;padding:30px 0;text-align:center}
  .urow{display:flex;gap:14px;align-items:baseline;padding:9px 4px;border-bottom:1px solid var(--line);font-size:13px}
  .urow .c{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
  .urow .c.plus{color:var(--muted)}
  .urow .refunded{color:var(--muted);text-decoration:line-through}
  #viewer{display:none;position:fixed;inset:0;z-index:40}
  #viewer .vbg{position:absolute;inset:0;background:rgba(27,30,24,.45)}
  #viewer .vcard{position:relative;max-width:860px;margin:5vh auto;height:88vh;display:flex;flex-direction:column;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px 24px;box-shadow:0 18px 50px rgba(0,0,0,.2)}
  #viewer .vh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  #viewer .vh .vt{font-family:var(--font-display);font-size:18px;font-weight:600;flex:1}
  #viewer .vbody{flex:1;overflow:auto;font-family:var(--font-read);line-height:1.85;font-size:15px}
  #viewer .vbody h1,#viewer .vbody h2,#viewer .vbody h3{font-family:var(--font-display);margin:1.2em 0 .5em}
  #viewer .vbody pre{white-space:pre-wrap;font-family:inherit}
</style>
</head>
<body>
<div class="nav">
  <a class="logo" href="/" style="text-decoration:none"><img src="/assets/brand/logo.png" alt="页面科技" onerror="this.style.display='none'" /></a><div class="brand">页面科技</div>
  <div class="grow"></div>
  <a class="keybtn" href="/" style="text-decoration:none;margin-right:8px">回工具</a>
  <button class="keybtn" id="keybtn" data-card-badge onclick="CARD.onBadgeClick()">登录</button>
</div>

<div class="wrap">
  <h1 style="font-size:28px;margin:26px 0 8px">我的记录</h1>
  <p class="sub">余额、消费流水、生成结果都跟着你的账户走。换台电脑登录，东西都在。
    生成结果保留最近 50 条 / 90 天。</p>

  <div class="whoami" id="whoami" style="display:none">
    <span id="whoEmail"></span>
    <button class="lnk" id="btnLogout">退出登录</button>
  </div>

  <div class="balance" id="balance"><div class="empty" style="padding:6px 0">登录后显示余额与消费流水</div></div>

  <details class="redeem">
    <summary>有充值券？兑换到账户</summary>
    <div class="rd-row">
      <input id="rdKey" placeholder="PZ-XXXX-XXXX-XXXX" />
      <button id="rdGo">兑换</button>
    </div>
    <div class="rd-msg" id="rdMsg">充值券是不记名的一次性凭证，兑换后点数并入账户，券即作废。</div>
  </details>

  <div class="tabs">
    <button id="tabResults" class="on">生成记录</button>
    <button id="tabUsage">消费流水</button>
  </div>
  <div id="list"><div class="empty">登录后这里会显示你的生成记录。<br /><a class="keybtn" style="text-decoration:none;display:inline-block;margin-top:10px;padding:10px 22px;border-radius:999px;background:var(--accent);color:#fff;border-color:var(--accent)" href="/login?next=%2Fhistory">去登录</a></div></div>
</div>

<div id="viewer">
  <div class="vbg" onclick="closeViewer()"></div>
  <div class="vcard">
    <div class="vh">
      <div class="vt" id="vTitle"></div>
      <button class="btn ghost" id="vCopy">复制</button>
      <button class="btn ghost" onclick="closeViewer()">关闭</button>
    </div>
    <div class="vbody" id="vBody"></div>
  </div>
</div>

<script src="/shared/keys.js?v=60ca7386"></script>
<script src="/shared/md.js"></script>
<script>
const $=id=>document.getElementById(id);
const TOOL_NAME={"seo-writer":"SEO 文章","seo-gap":"内容差距","article-quality":"质量检测",
                 "reddit-research":"Reddit 选题","outreach":"外链拓客","site-recon":"站点侦察"};
const ACT_NAME={outline:"大纲",article:"正文",polish:"润色",revise:"改大纲",check:"检测",
                analyze:"分析",run:"运行",image:"配图"};
let tab="results", current=null;

function fmt(ts){
  const d=new Date(ts*1000), p=n=>String(n).padStart(2,"0");
  return `${d.getMonth()+1}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

document.getElementById("btnLogout").onclick=()=>{
  if(confirm("退出登录？点数留在账户里，下次登录还在。")) CARD.signOut();
};
function toggleRedeem(on){ const d=document.querySelector(".redeem"); if(d) d.style.display=on?"":"none"; }
async function loadBalance(){
  // 没登录就把兑换区藏了 —— 兑换本来就要先有账户，露着只会让人白填一次
  if(!CARD.has()){ toggleRedeem(false); return; }
  toggleRedeem(true);
  const acct = CARD.account && CARD.account();
  if(acct){
    $("whoami").style.display="flex";
    $("whoEmail").textContent = "当前账户 " + acct.email;
  }
  const b=await CARD.refresh();
  if(!b){ $("balance").innerHTML='<div class="empty" style="padding:6px 0">身份已失效，请重新登录</div>'; return; }
  // 剩余不足一篇全套（10 点）就把数字标红 —— 提醒要早于用完那一刻
  const low = b.remaining < 10;
  $("balance").innerHTML=`
    <div class="b"><div class="k">剩余点数</div>
      <div class="v ${low?"low":"accent"}">${b.remaining}<small> / ${b.total}</small></div></div>
    <div class="b"><div class="k">今日已用</div><div class="v">${b.spent_today}<small> 点</small></div></div>
    <div class="b"><div class="k">本卡成品</div><div class="v" id="bWorks">—</div></div>
    ${b.label?`<div class="b"><div class="k">卡种</div>
      <div class="v" style="font-size:15px;font-family:var(--font-ui)">${b.label}</div></div>`:""}
    <div class="buy"><a href="/buy">${low?"点数不够了，续一张":"续一张"}</a></div>`;
}

/* 兑换充值券 */
document.getElementById("rdGo").onclick=async()=>{
  const key=$("rdKey").value.trim();
  const msg=$("rdMsg");
  if(!key){ msg.style.color="var(--seal)"; msg.textContent="请填写充值券号。"; return; }
  $("rdGo").disabled=true;
  try{
    const r=await fetch("/api/auth/redeem",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({card_key:key})});
    const j=await r.json();
    if(!r.ok) throw new Error(j.detail||"兑换失败");
    msg.style.color="var(--accent)";
    msg.textContent=`已兑换 ${j.credits} 点到账户。`;
    $("rdKey").value="";
    loadBalance();                       // 余额条立刻反映出来
  }catch(e){ msg.style.color="var(--seal)"; msg.textContent=String(e.message||e); }
  finally{ $("rdGo").disabled=false; }
};

function setWorks(n){ const e=$("bWorks"); if(e) e.innerHTML=n+'<small> 条</small>'; }
async function loadList(){
  if(!CARD.has()){ $("list").innerHTML='<div class="empty">登录后这里会显示你的生成记录。<br /><a class="keybtn" style="text-decoration:none;display:inline-block;margin-top:10px;padding:10px 22px;border-radius:999px;background:var(--accent);color:#fff;border-color:var(--accent)" href="/login?next=%2Fhistory">去登录</a></div>'; return; }
  $("list").innerHTML='<div class="empty">加载中…</div>';
  try{
    if(tab==="results"){
      const r=await fetch("/api/billing/history"); const j=await r.json();
      const items=j.items||[];
      setWorks(items.length);   // 摘要条里的"本卡成品"用这份列表回填，不另发请求
      if(!items.length){ $("list").innerHTML='<div class="empty">还没有生成记录。</div>'; return; }
      $("list").innerHTML="";
      items.forEach(it=>{
        const d=document.createElement("div"); d.className="item";
        d.innerHTML=`<div class="t">${esc(it.title||"(无标题)")}
            ${it.summary?`<div class="s">${esc(it.summary)}</div>`:""}</div>
          <div class="tag">${TOOL_NAME[it.tool]||it.tool}</div>
          <div class="d">${fmt(it.ts)}</div>`;
        d.onclick=()=>openResult(it.id);
        $("list").append(d);
      });
    }else{
      const r=await fetch("/api/billing/usage"); const j=await r.json();
      const items=j.items||[];
      if(!items.length){ $("list").innerHTML='<div class="empty">还没有消费流水。</div>'; return; }
      $("list").innerHTML="";
      items.forEach(u=>{
        const d=document.createElement("div"); d.className="urow";
        const refunded=u.status==="refunded";
        d.innerHTML=`<div class="d" style="color:var(--faint);width:78px">${fmt(u.ts)}</div>
          <div style="flex:1">${TOOL_NAME[u.tool]||u.tool} · ${ACT_NAME[u.action]||u.action}
            ${u.tier?`<span style="color:var(--faint)">（${u.tier}）</span>`:""}
            ${refunded?'<span style="color:var(--muted)">— 已退点</span>':""}</div>
          <div class="c ${refunded?"refunded":(u.credits?"":"plus")}">${u.credits?("-"+u.credits):"免费"}</div>`;
        $("list").append(d);
      });
    }
  }catch(e){ $("list").innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>'; }
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function openResult(id){
  try{
    const r=await fetch("/api/billing/result/"+id);
    if(!r.ok){ CARD.toast("取不到这条记录", true); return; }
    const j=await r.json(); current=j;
    $("vTitle").textContent=j.title||"结果";
    const p=j.payload||{};
    const text=p.article||p.outline||"";
    $("vBody").innerHTML = text ? MD.render(text)
      : "<pre>"+esc(JSON.stringify(p,null,2)).slice(0,20000)+"</pre>";
    $("viewer").style.display="block";
  }catch(e){ CARD.toast("打开失败："+e.message, true); }
}
function closeViewer(){ $("viewer").style.display="none"; }
$("vCopy").onclick=()=>{
  const p=(current&&current.payload)||{};
  const t=p.article||p.outline||JSON.stringify(p,null,2);
  navigator.clipboard.writeText(t).then(()=>CARD.toast("已复制"));
};

$("tabResults").onclick=()=>{tab="results";$("tabResults").classList.add("on");$("tabUsage").classList.remove("on");loadList();};
$("tabUsage").onclick=()=>{tab="usage";$("tabUsage").classList.add("on");$("tabResults").classList.remove("on");loadList();};
window.addEventListener("pz-card-updated",()=>{loadBalance();loadList();});
document.addEventListener("DOMContentLoaded",()=>{ loadBalance(); loadList(); });
</script>
</body>
</html>
